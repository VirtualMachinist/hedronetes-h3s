[package]
name = "h3s-kubelet"
description = "Typed pod FSM + CRI client"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
h3s-cri = { path = "../h3s-cri" }
base64 = "0.22"
sha2 = "0.10"
tokio-rustls = "0.26.5"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
h3s-supervisor = { path = "../h3s-supervisor" }
h3s-api = { path = "../h3s-api" }
h3s-auth = { path = "../h3s-auth" }
h3s-certs = { path = "../h3s-certs" }
tokio.workspace = true
rustls.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
thiserror = "2"
