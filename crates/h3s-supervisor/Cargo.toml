[package]
name = "h3s-supervisor"
description = "Agent supervisor tunnel"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tokio.workspace = true
rustls.workspace = true
tokio-util = { version = "0.7", features = ["compat", "rt"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink", "io"] }
yamux = "0.14.0"
bytes = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
