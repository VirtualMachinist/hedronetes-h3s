[workspace]
resolver = "2"
members = [
    "crates/h3s",
    "crates/h3s-api",
    "crates/h3s-apiserver",
    "crates/h3s-auth",
    "crates/h3s-certs",
    "crates/h3s-controllers",
    "crates/h3s-cri",
    "crates/h3s-kubelet",
    "crates/h3s-packaging",
    "crates/h3s-proxy",
    "crates/h3s-scheduler",
    "crates/h3s-storage",
    "crates/h3s-supervisor",
]

[workspace.package]
edition = "2021"
homepage = "https://github.com/VirtualMachinist/hedronetes-h3s"
license = "Apache-2.0"
repository = "https://github.com/VirtualMachinist/hedronetes-h3s"
rust-version = "1.88"
version = "0.9.1"

[workspace.dependencies]
# Runtime / CLI pins (P0). rustls default features are aws-lc-rs — not OpenSSL.
tokio = { version = "1", features = ["full"] }
rustls = "0.23"
clap = { version = "4", features = ["derive", "env"] }

k8s-openapi = { version = "0.26", features = ["v1_34"] }

# kube 2.x shares k8s-openapi 0.26 with the Kubernetes 1.34 API.
kube = { version = "=2.0.1", default-features = false, features = ["client", "runtime", "rustls-tls", "aws-lc-rs"] }
